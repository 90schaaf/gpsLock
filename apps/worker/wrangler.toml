name = "lockation"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

# Every minute: due sessions only (forbidden-zone warnings/penalties, deadlines); every 5th minute a full sweep
[triggers]
crons = ["* * * * *"]

[vars]
CHASTER_API_BASE = "https://api.chaster.app"
# Comma separated list of origins allowed to call the API (your GitHub Pages origin)
ALLOWED_ORIGINS = "https://90schaaf.github.io,http://localhost:5173"
# The slug of your extension in the Chaster developer portal
EXTENSION_SLUG = "lockation"
# Check-in page, used as click target in notifications
APP_URL = "https://90schaaf.github.io/lockation/app/index.html"

# Create with: npx wrangler d1 create lockation  → paste the database_id here,
# then: npx wrangler d1 migrations apply lockation --remote
[[d1_databases]]
binding = "DB"
database_name = "lockation"
database_id = "2c0f13ed-e335-4c3b-87d9-fc71cd01acfb"
migrations_dir = "migrations"

# Secrets (never commit!):
#   npx wrangler secret put CHASTER_TOKEN       (developer token from the Chaster developer portal)
#   npx wrangler secret put WEBHOOK_USERNAME
#   npx wrangler secret put WEBHOOK_PASSWORD
#   npx wrangler secret put NTFY_TOKEN          (ntfy.sh access token – enables notifications)
