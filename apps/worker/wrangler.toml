name = "gps-lock"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Every 5 minutes: missed check-ins, timed unfreeze, hunt timeouts (F2/F6/F7)
[triggers]
crons = ["*/5 * * * *"]

[vars]
CHASTER_API_BASE = "https://api.chaster.app"
# Comma separated list of origins allowed to call the API (your GitHub Pages origin)
ALLOWED_ORIGINS = "https://YOUR-GITHUB-USER.github.io,http://localhost:5173"
# The slug of your extension in the Chaster developer portal
EXTENSION_SLUG = "gps-lock"

# Create with: npx wrangler kv namespace create GPS_LOCK_KV  → paste the id here
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (never commit!):
#   npx wrangler secret put CHASTER_TOKEN       (developer token from the Chaster developer portal)
#   npx wrangler secret put WEBHOOK_USERNAME
#   npx wrangler secret put WEBHOOK_PASSWORD
